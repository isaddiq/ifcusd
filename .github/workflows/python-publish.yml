# Runs when a GitHub release is published (tag "v<version>", e.g. v1.0.0):
#   1. checks that the tag matches src/ifcusd/_version.py and runs the tests;
#   2. builds the wheel and sdist, a zip of the Unity integration and SHA256SUMS.txt;
#   3. attaches those files to the GitHub release;
#   4. publishes the wheel and sdist to PyPI, only when the repository variable
#      PUBLISH_TO_PYPI is "true" (configure PyPI trusted publishing first, see
#      the Contributing page of the website).

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/ifcusd/_version.py').read()).group(1))")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$VERSION'. Tag the release as v$VERSION."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Package release assets
        run: |
          mkdir -p release-assets staging
          cp dist/* release-assets/
          # Top folder "IfcUSD" so the zip extracts straight into a Unity project's Assets/ folder.
          cp -r integrations/unity staging/IfcUSD
          python -m zipfile -c "release-assets/ifcusd-unity-integration-$VERSION.zip" staging/IfcUSD/
          cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dists
          path: dist/

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets/

      - name: Attach files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  pypi-publish:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # Required for PyPI trusted publishing.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/IfcUSD/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
