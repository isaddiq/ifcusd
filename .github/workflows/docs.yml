# Builds the static documentation website from website/ and publishes it to GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".

name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/ifcusd/**"
      - "CITATION.cff"
      - "LICENSE"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "src/ifcusd/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install website tools
        run: python -m pip install -r website/requirements.txt

      - name: Build static site
        run: mkdocs build --strict --config-file website/mkdocs.yml --site-dir "${{ github.workspace }}/_site"

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
