site_name: IfcUSD
site_description: Complete, reproducible conversion of IFC building models to OpenUSD for NVIDIA Omniverse, Unity and any OpenUSD pipeline.
site_url: https://isaddiq.github.io/ifcusd/
site_author: IfcUSD contributors
repo_name: isaddiq/ifcusd
repo_url: https://github.com/isaddiq/ifcusd
edit_uri: edit/main/website/docs/
copyright: Copyright &copy; IfcUSD contributors &mdash; MIT License

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/isaddiq/ifcusd
      name: IfcUSD on GitHub
  generator: false

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: ["..", "."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - Tutorial: getting-started/tutorial.md
  - User guide:
      - IfcUSD Studio (UI): guide/studio.md
      - Command line: guide/cli.md
      - Python API: guide/python-api.md
      - What gets written: guide/output.md
      - Omniverse and Unity: guide/omniverse-and-unity.md
      - USD to IFC and robot data: guide/usd-to-ifc.md
      - Reports and validation: guide/validation.md
      - IFC5 (IFCX): guide/ifc5.md
      - Recipes: guide/recipes.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - IFC ↔ USD mapping: reference/schema-mapping.md
      - USD schema: reference/usd-schema.md
      - IFC extension for robot data: reference/ifc-extension.md
      - File formats: reference/file-formats.md
      - API reference: reference/api.md
  - About:
      - Existing methods: about/related-work.md
      - Contributing: about/contributing.md
      - Changelog: about/changelog.md
      - License and citation: about/citation.md
