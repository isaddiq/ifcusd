[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "IfcUSD"
dynamic = ["version"]
description = "Complete, reproducible conversion of IFC (IFC2X3, IFC4, IFC4X3, IFC5) building models to OpenUSD and back, with robot and simulation data, for NVIDIA Omniverse, Unity and any OpenUSD pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "OpenBIM2OpenUSD contributors" }
]
keywords = ["ifc", "openbim", "bim", "openusd", "usd", "ifcopenshell", "omniverse", "unity", "digital twin", "ifc5", "robotics", "isaac sim"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "ifcopenshell>=0.8.0",
  "usd-core>=24.8",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # Pinned to a minor series: new ruff releases can change formatting and fail CI.
  "ruff>=0.17,<0.18",
]

[project.urls]
Homepage = "https://github.com/isaddiq/ifcusd"
Documentation = "https://isaddiq.github.io/ifcusd/"
Issues = "https://github.com/isaddiq/ifcusd/issues"
Changelog = "https://isaddiq.github.io/ifcusd/about/changelog/"

[project.scripts]
ifcusd = "ifcusd.cli:main"
ifcusd-studio = "ifcusd.ui:main"

[tool.hatch.version]
path = "src/ifcusd/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ifcusd"]

[tool.hatch.build.targets.sdist]
# Leading slashes anchor the patterns at the repository root, so the website
# (website/) and other folders never end up in the source distribution.
include = [
  "/src/ifcusd",
  "/tests",
  "/integrations",
  "/ifc",
  "/convert_ifc_to_usd.py",
  "/app.py",
  "/README.md",
  "/CITATION.cff",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Lint and format the Python code only. Code examples in Markdown (README and
# website pages) are laid out by hand for readability.
extend-exclude = ["*.md", "website/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
